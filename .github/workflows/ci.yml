name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concierge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d concierge" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://oc_app:ci@localhost:5432/concierge
      DATABASE_URL_ADMIN: postgres://oc_admin:ci@localhost:5432/concierge
      DATABASE_URL_MIGRATIONS: postgres://oc_owner:ci@localhost:5432/concierge
      BETTER_AUTH_SECRET: ci-segredo-com-pelo-menos-32-caracteres
      BETTER_AUTH_URL: http://localhost:8080
      CPF_PEPPER: ci-pepper
      CREDENCIAIS_CHAVE: Y2ktY2hhdmUtZGUtMzItYnl0ZXMtcGFyYS10ZXN0ZSE=
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Tipos
        run: bunx tsc --noEmit -p .
      - name: Papéis e extensões (db/bootstrap.sql)
        run: >-
          psql postgres://postgres:postgres@localhost:5432/concierge -v ON_ERROR_STOP=1
          -v dbname=concierge -v owner_pw=ci -v app_pw=ci -v admin_pw=ci -f db/bootstrap.sql
      - name: Migrations (como oc_owner, sem superusuário)
        run: bunx drizzle-kit migrate
      - name: Schema sem migration pendente
        run: bunx drizzle-kit generate && test -z "$(git status --porcelain src/server/db/migrations)"
      - name: Testes (RLS)
        run: bun test
      - name: Seed
        run: bun run db:seed
      - name: Build
        run: bun run build
      # O build pode passar e o servidor quebrar em execução (ex.: dependência resolvida errada no
      # empacotamento, #73). Sobe o servidor de produção e confere a página inicial e o login.
      - name: Servidor de produção responde
        run: |
          PORT=8080 node .output/server/index.mjs > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/sign-in/email \
            -H 'content-type: application/json' -H 'origin: http://localhost:8080' \
            -d '{"email":"sindico@operacondo.local","password":"operacondo123"}')" = 200
      - name: Log do servidor (se falhou)
        if: failure()
        run: cat servidor.log || true
